name: Docker image build and push

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: Build latest Image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 nativ
          - { wscan-version: 20231015, arch: amd64, locale: en_US, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/amd64 }
          - { wscan-version: 20231015, arch: amd64, locale: de_DE, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/amd64 }
          
          # ARM64 nativ
          - { wscan-version: 20231015, arch: arm64, locale: en_US, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { wscan-version: 20231015, arch: arm64, locale: de_DE, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          
          # QEMU builds
          - { wscan-version: 20231015, arch: 386, locale: en_US, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/386, qemu: true }
          - { wscan-version: 20231015, arch: 386, locale: de_DE, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/386, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: en_US, variant: v6, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v6, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: en_US, variant: v7, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v7, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: de_DE, variant: v6, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v6, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: de_DE, variant: v7, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v7, qemu: true }
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      if: matrix.qemu == true
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Build and push with arch-specific tag
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        tags: ghcr.io/${{ github.repository_owner }}/w_scan_cpp:${{ matrix.wscan-version }}-${{ matrix.locale }}-${{ matrix.arch }}${{ matrix.variant }}
        push: true
        build-args: |
          VERSION=${{ matrix.wscan-version }}
          LOCALE=${{ matrix.locale }}.UTF-8
          LIBVERSION=${{ matrix.libversion }}
          PLUGINVERSION=${{ matrix.pluginversion }}
        cache-from: type=gha,scope=${{ matrix.arch }}${{ matrix.variant }}-${{ matrix.locale }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}${{ matrix.variant }}-${{ matrix.locale }}
    
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build-image.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
        
    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.wscan-version }}-${{ matrix.locale }}-${{ matrix.arch }}${{ matrix.variant }}
        path: /tmp/digests/*
        retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wscan-version: [20231015]
        locale: [en_US, de_DE]
    
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-${{ matrix.wscan-version }}-${{ matrix.locale }}-*
        merge-multiple: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create manifest list and push (version tag)
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ github.repository_owner }}/w_scan_cpp:${{ matrix.wscan-version }}-${{ matrix.locale }} \
          $(printf 'ghcr.io/${{ github.repository_owner }}/w_scan_cpp@sha256:%s ' *)
    
    - name: Create manifest list and push (latest-locale tag)
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ github.repository_owner }}/w_scan_cpp:latest-${{ matrix.locale }} \
          $(printf 'ghcr.io/${{ github.repository_owner }}/w_scan_cpp@sha256:%s ' *)
    
    - name: Create manifest list and push (latest tag)
      if: matrix.locale == 'en_US'
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ github.repository_owner }}/w_scan_cpp:latest \
          $(printf 'ghcr.io/${{ github.repository_owner }}/w_scan_cpp@sha256:%s ' *)
    
    - name: Inspect images
      run: |
        docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/w_scan_cpp:${{ matrix.wscan-version }}-${{ matrix.locale }}
        docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/w_scan_cpp:latest-${{ matrix.locale }}
