name: Docker image build and test

on: 
  pull_request:
    branches:
      - 'main'
  push:
    branches-ignore:
      - 'main'

jobs:
  build:
    name: Build latest Image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 nativ
          - { wscan-version: 20231015, arch: amd64, locale: en_US, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/amd64 }
          - { wscan-version: 20231015, arch: amd64, locale: de_DE, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/amd64 }
          
          # ARM64 nativ
          - { wscan-version: 20231015, arch: arm64, locale: en_US, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04-arm64, platform: linux/arm64 }
          - { wscan-version: 20231015, arch: arm64, locale: de_DE, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04-arm64, platform: linux/arm64 }
          
          # QEMU builds
          - { wscan-version: 20231015, arch: 386, locale: en_US, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/386, qemu: true }
          - { wscan-version: 20231015, arch: 386, locale: de_DE, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/386, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: en_US, variant: v6, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v6, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: en_US, variant: v7, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v7, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: de_DE, variant: v6, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v6, qemu: true }
          - { wscan-version: 20231015, arch: arm, locale: de_DE, variant: v7, libversion: 1.8.0, pluginversion: 2024.09.15, runner: ubuntu-24.04, platform: linux/arm/v7, qemu: true }
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      if: matrix.qemu == true
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
          
    - name: Build latest image
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        tags: w_scan_cpp:${{ matrix.wscan-version }}-${{ matrix.locale }}-${{ matrix.arch }}${{ matrix.variant }}
        build-args: |
          VERSION=${{ matrix.wscan-version }}
          LOCALE=${{ matrix.locale }}.UTF-8
          LIBVERSION=${{ matrix.libversion }}
          PLUGINVERSION=${{ matrix.pluginversion }}
        load: true
