name: Docker image build and test

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  # www.gen2vdr.de ist per Anubis gegen Bots geschuetzt, ein simples wget im
  # Dockerfile bekommt nur noch die Challenge-Seite. Der Download passiert
  # deshalb hier -- einmal fuer alle Matrix-Jobs, damit die Seite nicht von
  # jedem Build erneut belastet wird und alle Jobs identische Quellen bauen.
  download:
    name: Download sources
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { wscan-version: 20260515, pluginversion: 2026.05.15 }

    steps:
    - uses: actions/checkout@v7

    - name: Download sources from gen2vdr.de
      run: |
        mkdir -p downloads
        python3 tools/anubis-fetch.py \
          https://www.gen2vdr.de/wirbel/w_scan_cpp/w_scan_cpp-${{ matrix.wscan-version }}.tar.bz2 \
          downloads/w_scan_cpp-${{ matrix.wscan-version }}.tar.bz2
        python3 tools/anubis-fetch.py \
          https://www.gen2vdr.de/wirbel/wirbelscan/vdr-wirbelscan-${{ matrix.pluginversion }}.tgz \
          downloads/vdr-wirbelscan-${{ matrix.pluginversion }}.tgz

    - name: Upload sources
      uses: actions/upload-artifact@v7
      with:
        name: sources-${{ matrix.wscan-version }}-${{ matrix.pluginversion }}
        path: downloads/*
        retention-days: 1

  build:
    name: Build latest Image
    needs: download
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 nativ
          - { wscan-version: 20260515, arch: amd64, locale: en_US, libversion: 1.11.2, pluginversion: 2026.05.15, runner: ubuntu-24.04, platform: linux/amd64 }
              
          # ARM64 nativ
          - { wscan-version: 20260515, arch: arm64, locale: en_US, libversion: 1.11.2, pluginversion: 2026.05.15, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          
          # QEMU builds
          - { wscan-version: 20260515, arch: 386, locale: en_US, libversion: 1.11.2, pluginversion: 2026.05.15, runner: ubuntu-24.04, platform: linux/386, qemu: true }
          - { wscan-version: 20260515, arch: arm, locale: en_US, variant: v6, libversion: 1.11.2, pluginversion: 2026.05.15, runner: ubuntu-24.04, platform: linux/arm/v6, qemu: true }
          - { wscan-version: 20260515, arch: arm, locale: en_US, variant: v7, libversion: 1.11.2, pluginversion: 2026.05.15, runner: ubuntu-24.04, platform: linux/arm/v7, qemu: true }
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      if: matrix.qemu == true
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Fetch prepared sources
      uses: actions/download-artifact@v8
      with:
        name: sources-${{ matrix.wscan-version }}-${{ matrix.pluginversion }}
        path: downloads

    - name: Build latest image
      id: build-image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        tags: w_scan_cpp:${{ matrix.wscan-version }}-${{ matrix.locale }}-${{ matrix.arch }}${{ matrix.variant }}
        build-args: |
          VERSION=${{ matrix.wscan-version }}
          LOCALE=${{ matrix.locale }}.UTF-8
          LIBVERSION=${{ matrix.libversion }}
          PLUGINVERSION=${{ matrix.pluginversion }}
        load: true
